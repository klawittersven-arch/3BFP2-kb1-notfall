<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Nicht bewegen: Person liegt flach in der vorgefundenen Lage, eine Pflegekraft kniet am Kopf und hält ihn mit beiden Händen">
  <rect width="800" height="450" fill="#F4F7FA"/>
  <rect x="0" y="384" width="800" height="66" fill="#E3E8EE"/>
  <!-- liegende Person, flach, nicht bewegen -->
  <path d="M392 352 L560 356 L716 360" stroke="#2E3F55" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M728 360 L742 330" stroke="#F1C9A5" stroke-width="22" stroke-linecap="round"/>
  <path d="M244 350 L396 350" stroke="#3E7CB1" stroke-width="64" stroke-linecap="round"/>
  <path d="M258 344 L340 348" stroke="#356C9C" stroke-width="26" stroke-linecap="round"/>
  <path d="M340 348 L398 352" stroke="#F1C9A5" stroke-width="19" stroke-linecap="round"/>
  <circle cx="190" cy="342" r="34" fill="#F1C9A5"/>
  <path d="M158 352 A34 34 0 0 1 170 314 Q178 338 194 348 Z" fill="#5B4636"/>
  <circle cx="190" cy="322" r="3.5" fill="#333"/>
  <path d="M202 314 l6 -8 l2 6" stroke="#C99A78" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M212 332 q2 -6 -2 -10" stroke="#9A5A4A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Pflegekraft kniet hinter dem Kopf -->
  <path d="M30 376 L104 376 L84 290" stroke="#1F7A70" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M84 290 L108 178" stroke="#2A9D8F" stroke-width="60" stroke-linecap="round"/>
  <circle cx="118" cy="118" r="34" fill="#E2B48F"/>
  <path d="M86 112 A34 34 0 0 1 148 104 Q120 92 98 120 Z" fill="#2B2B2B"/>
  <circle cx="134" cy="116" r="3.5" fill="#333"/>
  <!-- Arme zum Kopf -->
  <path d="M118 186 L150 262" stroke="#2A9D8F" stroke-width="26" stroke-linecap="round"/>
  <path d="M150 262 L178 322" stroke="#E2B48F" stroke-width="18" stroke-linecap="round"/>
  <ellipse cx="184" cy="334" rx="16" ry="22" fill="#E2B48F" stroke="#C99A78" stroke-width="2"/>
  <!-- Hinweis -->
  <g class="beschriftung" font-family="Arial, sans-serif" font-weight="bold" fill="#C0392B">
    <text x="300" y="160" font-size="28">Nicht bewegen!</text>
    <text x="300" y="200" font-size="22" fill="#1F3A5F">Kopf mit beiden Händen halten –</text>
    <text x="300" y="230" font-size="22" fill="#1F3A5F">in der vorgefundenen Lage</text>
  </g>
</svg>
